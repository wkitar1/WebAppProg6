<!doctype html>
<html>
  <head>
    <title>Wiam Sales Computation</title>
  </head>
  <body>
    <h1>Sales and Discounts</h1>
    <h2>Getting input</h2>

    <input
      id="numberItems"
      type="number"
      value="1"
      placeholder="Enter number items"
    />
    <input
      id="itemCost"
      type="number"
      value="20.0"
      placeholder="Enter the cost of one item"
    />

    <input
      id="numberForDiscount"
      type="number"
      value="10"
      placeholder="Enter number to get discount"
    />
    <input
      id="DiscountRate"
      type="number"
      value="0.15"
      placeholder="Enter the discount rate"
    />
    <button type="button" onclick="doDiscount()">Show costs</button>
    <p id="results">
      <script>
        function doDiscount() {
          number = Number(document.getElementById("numberItems").value);
          cost = Number(document.getElementById("itemCost").value);
          discountAt = Number(
            document.getElementById("numberForDiscount").value,
          );
          discountRate = Number(document.getElementById("DiscountRate").value);
          let costs = "";
          for (
            let checkCount = number;
            checkCount <= 5 * number;
            checkCount += number
          ) {
            let totalCost;
            if (checkCount < discountAt) {
              totalCost = checkCount * cost;
            } else {
              totalCost =
                discountAt * cost +
                (checkCount - discountAt) * cost * (1 - discountRate);
            }
            costs += " checkCount " + checkCount + " is " + totalCost + ";";
          }
          document.getElementById("results").innerHTML = "Costs are: " + costs;
        }
      </script>
    </p>

    <form>
      <label for="form1_age">What is your age </label>
      <input
        type="number"
        id="form1_age"
        name="form1_age"
        min="10"
        max="50"
        step="2"
        value="30"
      />
      <br />

      <label for="form1_nick">What is your nickname </label>
      <input type="text" id="form1_nick" name="form1_nick" autofocus /> <br />

      <input
        type="button"
        onclick="resolveForm()"
        value="Get values from form"
      />
    </form>

    <p id="result">This text will be replaced</p>

    <script>
      function resolveForm() {
        console.log("Getting form values");
        age = document.getElementById("form1_age").value;
        nick = document.getElementById("form1_nick").value;
        confirmed = confirm("Are these the values? " + age + " and " + nick);

        out = document.getElementById("result");
        if (confirmed) {
          out.innerHTML = "Values were confirmed";
        } else {
          out.innerHTML = "Values were not confirmed";
        }
      }
    </script>
  </body>
</html>
