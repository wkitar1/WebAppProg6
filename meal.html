<!doctype html>
<html>
  <head>
    <title>Meal Planner</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>Wiam meal planner</h1>

    <h2>Getting input</h2>
    <form>
      <input type="checkbox" id="breakfast" value="True" />
      <label for="breakfast">Breakfast</label><br />

      <input type="checkbox" id="lunch" value="False" />
      <label for="lunch">Lunch</label><br />

      <input type="checkbox" id="dinner" value="True" />
      <label for="dinner">Dinner</label><br />

      <button type="button" onclick="choices()">Meal Plan Choices</button>
    </form>
    <p id="results"></p>

    <script>
      let my_meal_plan = {};
      function choices() {
        my_meal_plan = {};

        my_meal_plan.breakfast = document.getElementById("breakfast").checked;
        my_meal_plan.lunch = document.getElementById("lunch").checked;
        my_meal_plan.dinner = document.getElementById("dinner").checked;

        document.getElementById("results").innerHTML = my_meal_plan;
      }
    </script>

    <form>
      <label for="cuisine">Enter cuisine type</label>
      <input type="text" id="cuisine" value="Italian" /><br />

      <label for="beverage">Enter beverage choice</label>
      <input type="text" id="beverage" value="water" /><br />

      <button type="button" onclick="updateMeal()">Update the meal plan</button>
    </form>
    <script>
      function updateMeal() {
        let cuisine = document.getElementById("cuisine").value;
        let beverage = document.getElementById("beverage").value;

        my_meal_plan["cuisine"] = cuisine;
        my_meal_plan["beverage"] = beverage;

        document.getElementById("results").innerHTML = my_meal_plan;
      }
    </script>

    <form>
      <label for="form1_age">What is your age </label>
      <input
        type="number"
        id="form1_age"
        name="form1_age"
        min="10"
        max="50"
        step="2"
        value="30"
      />
      <br />

      <label for="form1_nick">What is your nickname </label>
      <input type="text" id="form1_nick" name="form1_nick" autofocus /> <br />

      <input
        type="button"
        onclick="resolveForm()"
        value="Get values from form"
      />
    </form>

    <p id="result">This text will be replaced</p>

    <script>
      function resolveForm() {
        console.log("Getting form values");
        age = document.getElementById("form1_age").value;
        nick = document.getElementById("form1_nick").value;
        confirmed = confirm("Are these the values? " + age + " and " + nick);

        out = document.getElementById("result");
        if (confirmed) {
          out.innerHTML = "Values were confirmed";
        } else {
          out.innerHTML = "Values were not confirmed";
        }
      }
    </script>
  </body>
</html>
